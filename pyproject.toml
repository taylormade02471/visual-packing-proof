[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stonewick-visual-packing-proof"
version = "0.1.0"
description = "Reviewer-testable visual search and packing verification proof"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using .* is deprecated.*:Warning",
]
